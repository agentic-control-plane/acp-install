# Harness canary — proves the released ACP install still wires into the
# CURRENT released harnesses and SDKs, with nobody watching.
#
# Every 6 hours (and on demand, and when a harness-release event arrives)
# each matrix leg installs the harness fresh, installs ACP through the live
# installer with a pre-seeded key (no device flow) and asserts the install
# invariants. Legs whose harness can run headless on a model that needs no
# vendor key go further: they push exactly one governed tool call and
# assert the audit row landed in ACP. The SDK job installs each published
# ACP SDK package and makes one governed tool-call check against the canary
# workspace. Failures file or update one deduped issue per leg in
# davidcrowe/gatewaystack-connect; a fully green leg closes any open canary
# issue for that leg. Coverage table, secrets and the workspace flag:
# docs/harness-canary.md.
#
# Drift sweep: the drift scout (gatewaystack-connect, apps/tenant-gateway/
# src/drift) files one `drift` issue per upstream release with the marker
# `<!-- drift-scout:key=release:<entryId>@<version> -->`. No dispatch token:
# after each leg reports, scripts/canary-report.mjs lists the open `drift`
# issues and resolves the ones for this leg's registry entries at the
# version the run just tested (pass -> comment + close; fail -> one comment
# per failure). The scheduled run therefore answers a release issue within
# ~6 h. SDK legs pass the upstream versions they installed as --tested
# pairs, since their own --version is the ACP package's. Dispatch pairing
# (repository_dispatch harness-release with client_payload.drift_issue) is
# still honoured for runs triggered by hand.
#
# Live legs (one governed `echo <marker>`, then the audit-row assert):
#   claude-code  claude-acp -p, BYO subscription OAuth (CLAUDE_CODE_OAUTH_TOKEN)
#                forwarded by the proxy; no ANTHROPIC_API_KEY anywhere.
#   opencode     opencode-acp run, acp/gemini-3.5-flash through the proxy.
#   qwen-code    qwen-acp -p, OPENAI_BASE_URL -> proxy, gemini-3.5-flash.
#   pi           pi-acp -p, acp/gemini-3.5-flash provider from models.json.
#   prime-agent  prime-acp -p, acp/gemini-3.5-flash (expected red: gsc#1378,
#                upstream rewritten in Rust; the leg reports, it does not hide).
# Invariants-only legs (why, in docs/harness-canary.md): codex, grok, dsh,
# hermes, openclaw, muse.

name: harness-canary

on:
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:
    inputs:
      harness:
        description: Which leg to run (all, harnesses, sdks, or one leg id)
        required: false
        default: all
        type: choice
        options:
          - all
          - harnesses
          - sdks
          - claude-code
          - codex
          - opencode
          - qwen-code
          - pi
          - prime-agent
          - grok
          - dsh
          - hermes
          - openclaw
          - muse
          - sdk-governance-js
          - sdk-governance-anthropic
          - sdk-proxy
          - sdk-governance-py
          - sdk-langchain
          - sdk-pydantic-ai
          - sdk-crewai
  repository_dispatch:
    types: [harness-release]

permissions:
  contents: read

env:
  # Scheduled set. prime-agent, grok and muse are dispatch-only until their
  # harness install path is verifiable (run 37692378153: `prime-agent`,
  # `@xai-org/grok-build` and `muse-code` are all 404 on npm; Prime Agent is
  # now a Rust binary (gsc#1378), Muse Code ships as a binary, Grok Build's
  # package is unnamed in the plugin repo). sdk-proxy is out until
  # @agenticcontrolplane/proxy is actually published (404 on npm; not in the
  # SDK monorepo tree either). Details: docs/harness-canary.md.
  ALL_HARNESSES: '["claude-code","codex","opencode","qwen-code","pi","dsh","hermes","openclaw"]'
  ALL_SDKS: '["sdk-governance-js","sdk-governance-anthropic","sdk-governance-py","sdk-langchain","sdk-pydantic-ai","sdk-crewai"]'

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      harnesses: ${{ steps.pick.outputs.harnesses }}
      sdks: ${{ steps.pick.outputs.sdks }}
    steps:
      - id: pick
        env:
          WANT: ${{ inputs.harness || github.event.client_payload.harness || 'all' }}
        run: |
          case "$WANT" in
            all)       echo "harnesses=$ALL_HARNESSES" >> "$GITHUB_OUTPUT"; echo "sdks=$ALL_SDKS" >> "$GITHUB_OUTPUT" ;;
            harnesses) echo "harnesses=$ALL_HARNESSES" >> "$GITHUB_OUTPUT"; echo "sdks=[]" >> "$GITHUB_OUTPUT" ;;
            sdks)      echo "harnesses=[]" >> "$GITHUB_OUTPUT"; echo "sdks=$ALL_SDKS" >> "$GITHUB_OUTPUT" ;;
            sdk-*)     echo "harnesses=[]" >> "$GITHUB_OUTPUT"; echo "sdks=[\"$WANT\"]" >> "$GITHUB_OUTPUT" ;;
            *)         echo "harnesses=[\"$WANT\"]" >> "$GITHUB_OUTPUT"; echo "sdks=[]" >> "$GITHUB_OUTPUT" ;;
          esac

  canary:
    needs: select
    if: needs.select.outputs.harnesses != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.select.outputs.harnesses) }}
    concurrency:
      group: harness-canary-${{ matrix.harness }}
      cancel-in-progress: false
    env:
      HARNESS: ${{ matrix.harness }}
      MARKER: acp-canary-${{ github.run_id }}-${{ matrix.harness }}
      ACP_BASE_URL: https://api.agenticcontrolplane.com
      # Legs that push one governed call. Everything else ends at the
      # invariants (see the header comment and docs/harness-canary.md).
      LIVE_LEGS: ' claude-code opencode qwen-code pi prime-agent '
    steps:
      - uses: actions/checkout@v4

      # openclaw@2026.9.8 refuses to install on Node 22 (engines
      # >=24.16.0 <25 || >=26.1.0); everything else is pinned to 22.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.harness == 'openclaw' && '24' || '22' }}

      - uses: actions/setup-python@v5
        if: matrix.harness == 'hermes'
        with:
          python-version: '3.12'

      # Package names for qwen-code, pi, openclaw come from the harness repos
      # / the pi monorepo; dsh is @deepseek-ai/dsh (verified with npm view,
      # 2026-10-07). pi and prime-agent: the installer detects them by
      # ~/.pi/agent and ~/.prime/agent, which a fresh npm install does not
      # create, so the leg creates the dir (same as muse's ~/.config/muse).
      # prime-agent, grok, muse names are still unverified (see env above).
      - name: Install current released harness
        id: harness
        run: |
          set -eo pipefail
          case "$HARNESS" in
            claude-code) npm i -g @anthropic-ai/claude-code@latest;          v="$(claude --version | head -1)" ;;
            codex)       npm i -g @openai/codex@latest;                       v="$(codex --version | head -1)" ;;
            opencode)    npm i -g opencode-ai@latest;                         v="$(opencode --version | head -1)" ;;
            qwen-code)   npm i -g @qwen-code/qwen-code@latest;                v="$(qwen --version | head -1)" ;;
            pi)          npm i -g @earendil-works/pi-coding-agent@latest; mkdir -p "$HOME/.pi/agent"; v="$(pi --version | head -1)" ;;
            prime-agent) npm i -g prime-agent@latest; mkdir -p "$HOME/.prime/agent"; v="$(prime-agent --version 2>/dev/null | head -1 || prime --version | head -1)" ;;
            grok)        npm i -g @xai-org/grok-build@latest;                 v="$(grok --version | head -1)" ;;
            dsh)         npm i -g @deepseek-ai/dsh@latest;                     v="$(dsh --version | head -1)" ;;
            hermes)      pipx install hermes-agent;                           v="$(hermes --version | head -1)" ;;
            openclaw)    npm i -g openclaw@latest;                            v="$(openclaw --version | head -1)" ;;
            muse)        npm i -g muse-code@latest; mkdir -p "$HOME/.config/muse"; v="$(muse --version | head -1)" ;;
            *) echo "unknown harness $HARNESS"; exit 2 ;;
          esac
          echo "resolved: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Seed ACP credentials (skips the device flow)
        id: seed
        env:
          ACP_CANARY_KEY: ${{ secrets.ACP_CANARY_KEY }}
        run: |
          set -e
          test -n "$ACP_CANARY_KEY" || { echo "ACP_CANARY_KEY secret is not set"; exit 2; }
          mkdir -p "$HOME/.acp"
          printf '%s\n' "$ACP_CANARY_KEY" > "$HOME/.acp/credentials"
          chmod 600 "$HOME/.acp/credentials"
          # qwen-acp only prices a launch when Qwen Code's auth type is
          # "openai" (it then honours OPENAI_BASE_URL -> the proxy). Seed that
          # before the installer merges its hooks into the same file.
          if [ "$HARNESS" = "qwen-code" ]; then
            mkdir -p "$HOME/.qwen"
            [ -f "$HOME/.qwen/settings.json" ] || printf '{ "security": { "auth": { "selectedType": "openai" } } }\n' > "$HOME/.qwen/settings.json"
          fi

      - name: Install ACP via the live installer
        id: acp_install
        run: |
          set -eo pipefail
          # No TTY here: --only picks the harness, and the seeded key makes
          # Step 2 (Authenticate) keep the existing key and exit 0.
          curl -sf https://agenticcontrolplane.com/install.sh | bash -s -- "--only=$HARNESS" 2>&1 | tee acp-install.log
          echo "CANARY_SINCE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Assert install invariants
        id: invariants
        run: node scripts/canary-assert.mjs invariants --harness "$HARNESS" 2>&1 | tee canary-invariants.log

      # Live legs only. Model traffic rides the ACP proxy on the seeded key:
      # Gemini on the platform key for opencode / qwen-code / pi / prime-agent,
      # the canary's own subscription OAuth (forwarded verbatim by the proxy's
      # BYO path, apps/tenant-gateway/src/proxy/anthropicNative.ts) for
      # claude-code. No ANTHROPIC_API_KEY / OPENAI_API_KEY exists in this job.
      - name: One governed tool call
        id: call
        if: contains(env.LIVE_LEGS, format(' {0} ', matrix.harness))
        env:
          ACP_CANARY_KEY: ${{ secrets.ACP_CANARY_KEY }}
          ACP_TENANT_SLUG: ${{ vars.ACP_CANARY_TENANT_SLUG }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.harness == 'claude-code' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          set -o pipefail
          prompt="Run exactly: echo $MARKER"
          case "$HARNESS" in
            claude-code)
              test -n "$CLAUDE_CODE_OAUTH_TOKEN" || { echo "CLAUDE_CODE_OAUTH_TOKEN secret is not set"; exit 2; }
              timeout 300 "$HOME/.acp/bin/claude-acp" -p "$prompt" --allowedTools "Bash(echo:*)" 2>&1 | tee canary-run.log ;;
            opencode)    timeout 300 "$HOME/.acp/bin/opencode-acp" run "$prompt" 2>&1 | tee canary-run.log ;;
            qwen-code)
              # Headless qwen cannot prompt, so without --yolo it declines
              # run_shell_command ("permission ... was declined (non-interactive
              # mode cannot prompt)"), the model hunts with tool_search/Read/glob
              # and never emits the echo. --yolo skips only qwen's own prompt;
              # the ACP PreToolUse hook still gates every call. </dev/null so
              # a stray stdin read cannot hang the leg.
              QWEN_CODE_SUPPRESS_YOLO_WARNING=1 timeout 300 "$HOME/.acp/bin/qwen-acp" --yolo -p "$prompt" </dev/null 2>&1 | tee canary-run.log ;;
            pi)          timeout 300 "$HOME/.acp/bin/pi-acp" -p "$prompt" 2>&1 | tee canary-run.log ;;
            prime-agent) timeout 300 "$HOME/.acp/bin/prime-acp" -p "$prompt" 2>&1 | tee canary-run.log ;;
            *) echo "no live call defined for $HARNESS"; exit 2 ;;
          esac
          rc=$?
          # gsc#1380: a headless harness rejecting the governed call is a
          # product bug, not a pass. Fail the step and dump every audit row
          # in the window with its decision so the failure can be classified
          # (decision=allow -> plugin/harness permission contract drift;
          # decision=ask -> the gateway is asking in audit mode).
          if grep -Eiq 'auto-rejecting|rejected permission|Denied at approval|permission denied|requires approval|permission was declined' canary-run.log; then
            echo "FAIL $HARNESS rejected the governed call (gsc#1380):"
            grep -Ei 'auto-rejecting|rejected permission|Denied at approval|permission denied|requires approval|permission was declined' canary-run.log
            echo "audit rows seen since $CANARY_SINCE (decision per row):"
            node scripts/canary-assert.mjs rows --harness "$HARNESS" --since "$CANARY_SINCE" || true
            exit 1
          fi
          exit "$rc"

      - name: Assert the audit row landed in ACP
        id: audit
        if: always() && contains(env.LIVE_LEGS, format(' {0} ', matrix.harness)) && steps.call.outcome != 'skipped'
        env:
          ACP_CANARY_KEY: ${{ secrets.ACP_CANARY_KEY }}
          ACP_TENANT_SLUG: ${{ vars.ACP_CANARY_TENANT_SLUG }}
        run: |
          set -eo pipefail
          test -n "$ACP_TENANT_SLUG" || { echo "ACP_CANARY_TENANT_SLUG repository variable is not set"; exit 2; }
          node scripts/canary-assert.mjs audit --harness "$HARNESS" --since "$CANARY_SINCE" --marker "$MARKER" --timeout 120 2>&1 | tee canary-audit.log

      # The step list is per harness: live legs own `call` + `audit`; the
      # others end at `invariants`. A leg is green only when EVERY step on
      # its list has outcome=success (skipped or cancelled is not green), so
      # a skipped step can never close an open issue.
      - name: File, update or close the canary issue
        if: always()
        env:
          CANARY_ISSUES_TOKEN: ${{ secrets.CANARY_ISSUES_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HARNESS_VERSION: ${{ steps.harness.outputs.version }}
          # Drift-scout pairing (repository_dispatch harness-release): the
          # verdict is also commented on the drift issue, which is closed on
          # a pass for release-type drift (docs/harness-canary.md).
          DRIFT_ISSUE: ${{ github.event.client_payload.drift_issue || '' }}
          DRIFT_VERSION: ${{ github.event.client_payload.version || '' }}
          DRIFT_KIND: ${{ github.event.client_payload.drift_kind || '' }}
          DRIFT_CLOSE: ${{ github.event.client_payload.drift_issue && github.event.client_payload.close_on_pass == false && 'off' || '' }}
          O_HARNESS: ${{ steps.harness.outcome }}
          O_SEED: ${{ steps.seed.outcome }}
          O_INSTALL: ${{ steps.acp_install.outcome }}
          O_INVARIANTS: ${{ steps.invariants.outcome }}
          O_CALL: ${{ steps.call.outcome }}
          O_AUDIT: ${{ steps.audit.outcome }}
        run: |
          set -e
          steps="install-harness:$O_HARNESS: seed-credentials:$O_SEED: install-acp:$O_INSTALL:acp-install.log install-invariants:$O_INVARIANTS:canary-invariants.log"
          case "$LIVE_LEGS" in *" $HARNESS "*)
            steps="$steps governed-call:$O_CALL:canary-run.log,canary-audit.log audit-row:$O_AUDIT:canary-run.log,canary-audit.log" ;;
          esac
          failed=""; log=""; status=success
          for triple in $steps; do
            name="${triple%%:*}"; rest="${triple#*:}"; outcome="${rest%%:*}"; file="${rest#*:}"
            echo "$name: $outcome"
            if [ "$outcome" != "success" ]; then
              status=failure
              if [ -z "$failed" ]; then failed="$name"; log="$file"; fi
            fi
          done
          node scripts/canary-report.mjs --harness "$HARNESS" --status "$status" --version "$HARNESS_VERSION" \
            --run-url "$RUN_URL" --failed-step "${failed:-none}" ${log:+--log "$log"} \
            ${DRIFT_ISSUE:+--drift-issue "$DRIFT_ISSUE"} ${DRIFT_VERSION:+--drift-version "$DRIFT_VERSION"} \
            ${DRIFT_KIND:+--drift-kind "$DRIFT_KIND"} ${DRIFT_CLOSE:+--drift-close "$DRIFT_CLOSE"}

  # SDK legs: install the PUBLISHED package (npm / PyPI, latest), make one
  # governed tool-call check (POST /govern/tool-use with tool `shell`,
  # command `echo <marker>`) against the canary workspace with the seeded
  # key, and assert the audit row landed. The proxy SDK has no tool-call
  # shape: its check is one acpFetch through ACP's egress and a typed
  # answer (connected, not connected, or policy-denied all count; 401 and
  # unreachable do not). Each leg's step list: install-package, run-check,
  # audit-row (the proxy leg has no audit-row step).
  sdk:
    needs: select
    if: needs.select.outputs.sdks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.select.outputs.sdks) }}
    concurrency:
      group: harness-canary-${{ matrix.sdk }}
      cancel-in-progress: false
    env:
      LEG: ${{ matrix.sdk }}
      MARKER: acp-canary-${{ github.run_id }}-${{ matrix.sdk }}
      ACP_BASE_URL: https://api.agenticcontrolplane.com
      ACP_CANARY_KEY: ${{ secrets.ACP_CANARY_KEY }}
      ACP_TENANT_SLUG: ${{ vars.ACP_CANARY_TENANT_SLUG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: contains(fromJSON('["sdk-governance-py","sdk-langchain","sdk-pydantic-ai","sdk-crewai"]'), matrix.sdk)
        with:
          python-version: '3.12'

      - name: Install the published package
        id: pkg
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/sdk" && cd "$RUNNER_TEMP/sdk" && npm init -y > /dev/null
          case "$LEG" in
            sdk-governance-js)        npm i @agenticcontrolplane/governance@latest;           v="$(npm ls @agenticcontrolplane/governance --depth=0 | grep -o '@agenticcontrolplane/governance@[0-9.]*')" ;;
            sdk-governance-anthropic) npm i @agenticcontrolplane/governance-anthropic@latest; v="$(npm ls @agenticcontrolplane/governance-anthropic --depth=0 | grep -o '@agenticcontrolplane/governance-anthropic@[0-9.]*')" ;;
            sdk-proxy)                npm i @agenticcontrolplane/proxy@latest;                v="$(npm ls @agenticcontrolplane/proxy --depth=0 | grep -o '@agenticcontrolplane/proxy@[0-9.]*')" ;;
            sdk-governance-py)        pip install -q acp-governance;   v="$(pip show acp-governance | grep -i '^version')" ;;
            sdk-langchain)            pip install -q acp-langchain 'langchain>=1.3.3';   v="$(pip show acp-langchain | grep -i '^version')" ;;
            sdk-pydantic-ai)          pip install -q acp-pydantic-ai;  v="$(pip show acp-pydantic-ai | grep -i '^version')" ;;
            sdk-crewai)               pip install -q acp-crewai;       v="$(pip show acp-crewai | grep -i '^version')" ;;
            *) echo "unknown sdk leg $LEG"; exit 2 ;;
          esac
          echo "resolved: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Upstream versions this leg actually installed, as drift-registry
          # entryId=version pairs, so the reporter's drift sweep can match
          # the scout's release issues (its own version above is the ACP
          # package's). Entry ids and leg mapping: registry.ts canaryLeg.
          pyver() { pip show "$1" 2>/dev/null | sed -n 's/^Version: //p' || true; }
          u=""
          case "$LEG" in
            sdk-langchain)            u="langchain-core=$(pyver langchain-core),langgraph=$(pyver langgraph)" ;;
            sdk-crewai)               u="crewai=$(pyver crewai)" ;;
            sdk-governance-anthropic) u="anthropic-sdk-typescript=$(npm ls @anthropic-ai/sdk --depth=1 2>/dev/null | grep -o '@anthropic-ai/sdk@[0-9.]*' | head -1 | sed 's/.*@//' || true)" ;;
          esac
          echo "upstream: ${u:-(none mapped)}"
          echo "upstream=$u" >> "$GITHUB_OUTPUT"
          echo "CANARY_SINCE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: One governed tool-call check
        id: call
        run: |
          set -eo pipefail
          test -n "$ACP_CANARY_KEY" || { echo "ACP_CANARY_KEY secret is not set"; exit 2; }
          name="${LEG#sdk-}"
          case "$LEG" in
            sdk-governance-js|sdk-governance-anthropic|sdk-proxy)
              # ESM resolution ignores NODE_PATH: run the script from the
              # directory the package was installed into.
              cp "scripts/canary-sdk-$name.mjs" "$RUNNER_TEMP/sdk/"
              node "$RUNNER_TEMP/sdk/canary-sdk-$name.mjs" 2>&1 | tee canary-run.log ;;
            *)
              python "scripts/canary-sdk-$name.py" 2>&1 | tee canary-run.log ;;
          esac

      - name: Assert the audit row landed in ACP
        id: audit
        if: always() && matrix.sdk != 'sdk-proxy' && steps.call.outcome != 'skipped'
        run: |
          set -eo pipefail
          test -n "$ACP_TENANT_SLUG" || { echo "ACP_CANARY_TENANT_SLUG repository variable is not set"; exit 2; }
          node scripts/canary-assert.mjs audit --harness "$LEG" --since "$CANARY_SINCE" --marker "$MARKER" --timeout 120 2>&1 | tee canary-audit.log

      - name: File, update or close the canary issue
        if: always()
        env:
          CANARY_ISSUES_TOKEN: ${{ secrets.CANARY_ISSUES_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
          UPSTREAM_VERSIONS: ${{ steps.pkg.outputs.upstream }}
          DRIFT_ISSUE: ${{ github.event.client_payload.drift_issue || '' }}
          DRIFT_VERSION: ${{ github.event.client_payload.version || '' }}
          DRIFT_KIND: ${{ github.event.client_payload.drift_kind || '' }}
          DRIFT_CLOSE: ${{ github.event.client_payload.drift_issue && github.event.client_payload.close_on_pass == false && 'off' || '' }}
          O_PKG: ${{ steps.pkg.outcome }}
          O_CALL: ${{ steps.call.outcome }}
          O_AUDIT: ${{ steps.audit.outcome }}
        run: |
          set -e
          steps="install-package:$O_PKG: run-check:$O_CALL:canary-run.log"
          if [ "$LEG" != "sdk-proxy" ]; then steps="$steps audit-row:$O_AUDIT:canary-run.log,canary-audit.log"; fi
          failed=""; log=""; status=success
          for triple in $steps; do
            name="${triple%%:*}"; rest="${triple#*:}"; outcome="${rest%%:*}"; file="${rest#*:}"
            echo "$name: $outcome"
            if [ "$outcome" != "success" ]; then
              status=failure
              if [ -z "$failed" ]; then failed="$name"; log="$file"; fi
            fi
          done
          node scripts/canary-report.mjs --harness "$LEG" --status "$status" --version "$PKG_VERSION" \
            --run-url "$RUN_URL" --failed-step "${failed:-none}" ${log:+--log "$log"} \
            ${UPSTREAM_VERSIONS:+--tested "$UPSTREAM_VERSIONS"} \
            ${DRIFT_ISSUE:+--drift-issue "$DRIFT_ISSUE"} ${DRIFT_VERSION:+--drift-version "$DRIFT_VERSION"} \
            ${DRIFT_KIND:+--drift-kind "$DRIFT_KIND"} ${DRIFT_CLOSE:+--drift-close "$DRIFT_CLOSE"}
